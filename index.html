<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="0; url=http://localhost:3000/">
  <title>MALEMI — Redirecionando para a aplicação</title>
  <script>
    window.location.href = "http://localhost:3000/";
  </script>
  <style>
    body {
      background-color: #05070B;
      color: #F8FAFC;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
    .card {
      background: #0F1728;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 32px;
      max-width: 480px;
      text-align: center;
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    }
    .logo {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 2px;
      color: #FFFFFF;
      margin-bottom: 8px;
    }
    .logo span {
      color: #09CCA2;
    }
    p {
      color: #94A3B8;
      font-size: 15px;
      line-height: 1.5;
      margin: 12px 0;
    }
    .btn {
      display: inline-block;
      margin-top: 20px;
      padding: 14px 28px;
      background: #09CCA2;
      color: #05070B;
      font-weight: 700;
      font-size: 15px;
      text-decoration: none;
      border-radius: 10px;
      transition: background 0.2s;
    }
    .btn:hover {
      background: #10dfb3;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">MALEMI<span>.</span></div>
    <h2 style="font-size: 18px; margin: 0 0 12px 0; color: #FFFFFF;">Aplicação Next.js Ativa</h2>
    <p>
      Você abriu a porta <strong>5500</strong> (Live Server). O site institucional da MALEMI está rodando com todos os recursos na porta <strong>3000</strong>.
    </p>
    <p>Redirecionando automaticamente em instantes...</p>
    <a href="http://localhost:3000/" class="btn">
      Abrir Site da MALEMI (Porta 3000)
    </a>
  </div>
</body>
</html>
